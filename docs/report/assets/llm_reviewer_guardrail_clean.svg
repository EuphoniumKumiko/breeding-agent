    --_arrow:         var(--accent, #F7F9FB 85%, var(--bg)));
    --_node-fill:     var(--surface, #F7F9FB 3%, var(--bg)));
    --_node-stroke:   var(--border, #F7F9FB 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     #F7F9FB 5%, var(--bg));
    --_inner-stroke:  #F7F9FB 12%, var(--bg));
    --_key-badge:     #F7F9FB 10%, var(--bg));
  }
</style>
