<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, #F7F9FB 60%, var(--bg)));
    --_text-muted:    var(--muted, #F7F9FB 40%, var(--bg)));
    --_text-faint:    #F7F9FB 25%, var(--bg));
    --_line:          var(--line, #F7F9FB 50%, var(--bg)));
    --_arrow:         var(--accent, #F7F9FB 85%, var(--bg)));
    --_node-fill:     var(--surface, #F7F9FB 3%, var(--bg)));
    --_node-stroke:   var(--border, #F7F9FB 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     #F7F9FB 5%, var(--bg));
    --_inner-stroke:  #F7F9FB 12%, var(--bg));
    --_key-badge:     #F7F9FB 10%, var(--bg));
  }
</style>
